---
# On EC2 the SES credentials come from a lookup instead of a registered shell task, because task results
# end up in the output and in the ASP simulation JSON (CDINFRA-1262).
# The pipe lookup drops stderr and reports only the exit code, so the command sends its errors to syslog.
_update_postfix_config_sasl: "{{ (lookup('ansible.builtin.pipe', _update_postfix_config_ses_decrypt_command) | from_yaml) if ansible_facts['system_vendor'] == 'Amazon EC2' else _sasl }}"
# Every reference to _update_postfix_config_sasl runs the lookup again, and every task under a `when`
# evaluates the condition again. Conditions use this flag instead, which needs no decrypt: on EC2 the
# credentials always come from KMS, so only the sasl_passwd template decrypts, once per run.
_update_postfix_config_sasl_enabled: "{{ ansible_facts['system_vendor'] == 'Amazon EC2' or (_sasl is defined and _sasl | length > 0) }}"
_update_postfix_config_ses_decrypt_command: >-
  /bin/bash -c 'set -o pipefail; exec 2> >(logger -t update_postfix_config -p user.err);
  aws kms decrypt --region eu-central-1 --ciphertext-blob fileb://<(base64 -d /etc/postfix/ses_credentials.yml)
  --output text --query Plaintext | base64 -d'
