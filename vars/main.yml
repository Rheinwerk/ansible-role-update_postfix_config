---
# On EC2 the SES credentials come from a lookup instead of a registered shell task, because task results
# end up in the output and in the ASP simulation JSON (CDINFRA-1262)
_update_postfix_config_sasl: "{{ (lookup('ansible.builtin.pipe', _update_postfix_config_ses_decrypt_command) | from_yaml) if ansible_facts['system_vendor'] == 'Amazon EC2' else _sasl }}"
_update_postfix_config_ses_decrypt_command: >-
  /bin/bash -c 'set -o pipefail;
  aws kms decrypt --region eu-central-1 --ciphertext-blob fileb://<(base64 -d /etc/postfix/ses_credentials.yml)
  --output text --query Plaintext | base64 -d'
